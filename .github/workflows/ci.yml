name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Formatting & Clang-Tidy (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            wget \
            gnupg \
            software-properties-common \
            opencl-headers \
            ocl-icd-opencl-dev \
            pocl-opencl-icd

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Check code formatting
        run: |
          cmake --build build --target check-format

      - name: Run Clang-Tidy
        run: |
          cmake --build build --target tidy

  build:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            wget \
            gnupg \
            software-properties-common \
            opencl-headers \
            ocl-icd-opencl-dev \
            pocl-opencl-icd \
            python3-pip

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/llvm-dis llvm-dis /usr/bin/llvm-dis-22 100
          if [ -f /usr/lib/llvm-22/bin/FileCheck ]; then
            sudo ln -sf /usr/lib/llvm-22/bin/FileCheck /usr/local/bin/FileCheck
          fi

          sudo pip install --break-system-packages lit

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build Project
        run: |
          cmake --build build --config Release -- -j$(nproc)

      - name: Run Tests
        run: |
          cmake --build build --target runtests

      - name: Verify Executables
        run: |
          echo "Checking ocldbg..."
          ./build/ocldbg || [ $? -eq 1 ]

          if [ -f ./build/test_host_runner ]; then
            echo "Checking test_host_runner..."
            ./build/test_host_runner tests/kernels/hello_kernel.cl || true
          fi
