name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Pinned so CI stays reproducible. The plugin shares Oclgrind's C++ ABI, so
  # this must be built against the same LLVM as ocldbg itself.
  OCLGRIND_COMMIT: 5597a379b4f7d74c4af5532260df0366c277259f

jobs:
  lint:
    name: Formatting & Clang-Tidy (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get purge -y "*clang*18*" "*llvm*18*" "*lldb*18*"
          sudo apt-get autoremove -y

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            wget \
            gnupg \
            software-properties-common \
            opencl-headers \
            ocl-icd-opencl-dev

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-22 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100
          sudo update-alternatives --install /usr/bin/lldb lldb /usr/bin/lldb-22 100
          sudo apt-get install -y --no-install-recommends liblldb-22-dev liblldb-22 || true
          sudo apt-get install -y --no-install-recommends libclang-22-dev libpolly-22-dev

      - name: Cache Oclgrind
        id: oclgrind-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/oclgrind
          key: oclgrind-${{ env.OCLGRIND_COMMIT }}-llvm22-${{ runner.os }}

      - name: Build Oclgrind
        if: steps.oclgrind-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/jrprice/Oclgrind.git oclgrind-src
          git -C oclgrind-src checkout ${OCLGRIND_COMMIT}
          cmake -S oclgrind-src -B oclgrind-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local/oclgrind \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DCLANG_ROOT=/usr/lib/llvm-22
          cmake --build oclgrind-build -- -j$(nproc)
          cmake --install oclgrind-build

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DRUN_CLANG_TIDY_BIN=/usr/bin/run-clang-tidy-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DOCLGRIND_ROOT=$HOME/.local/oclgrind

      - name: Check code formatting
        run: |
          cmake --build build --target check-format

      - name: Run Clang-Tidy
        run: |
          cmake --build build --target tidy

  build:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            wget \
            gnupg \
            software-properties-common \
            opencl-headers \
            ocl-icd-opencl-dev \
            python3-psutil

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/llvm-dis llvm-dis /usr/bin/llvm-dis-22 100
          sudo update-alternatives --install /usr/bin/lldb lldb /usr/bin/lldb-22 100
          sudo apt-get install -y --no-install-recommends liblldb-22-dev liblldb-22 || true
          sudo apt-get install -y --no-install-recommends libclang-22-dev libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH
          echo "LLDB_DEBUGSERVER_PATH=/usr/lib/llvm-22/bin/lldb-server" >> $GITHUB_ENV

      - name: Cache Oclgrind
        id: oclgrind-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/oclgrind
          key: oclgrind-${{ env.OCLGRIND_COMMIT }}-llvm22-${{ runner.os }}

      - name: Build Oclgrind
        if: steps.oclgrind-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/jrprice/Oclgrind.git oclgrind-src
          git -C oclgrind-src checkout ${OCLGRIND_COMMIT}
          cmake -S oclgrind-src -B oclgrind-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local/oclgrind \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DCLANG_ROOT=/usr/lib/llvm-22
          cmake --build oclgrind-build -- -j$(nproc)
          cmake --install oclgrind-build

      - name: Setup Micromamba & Install PoCL
        id: micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pocl-env
          create-args: >-
            pocl
            lit
            psutil
          init-shell: bash
          cache-environment: true
          cache-downloads: true

      - name: Configure PoCL ICD & Runtime
        run: |
          POCL_ENV="${{ steps.micromamba.outputs.environment-path }}"
          echo "PoCL environment path: $POCL_ENV"
          echo "$POCL_ENV/lib" | sudo tee /etc/ld.so.conf.d/conda-pocl.conf
          sudo ldconfig
          sudo mkdir -p /etc/OpenCL/vendors
          sudo cp -f "$POCL_ENV"/etc/OpenCL/vendors/*.icd /etc/OpenCL/vendors/
          echo "OCL_ICD_VENDORS=$POCL_ENV/etc/OpenCL/vendors" >> $GITHUB_ENV
          echo "$POCL_ENV/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$POCL_ENV/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DOCLGRIND_ROOT=$HOME/.local/oclgrind

      - name: Build Project
        run: |
          cmake --build build --config Release -- -j$(nproc)

      - name: Run Tests
        run: |
          cmake --build build --target runtests

      - name: Verify Executables
        run: |
          echo "Checking ocldbg..."
          ./build/ocldbg || [ $? -eq 1 ]

          if [ -f ./build/test_host_runner ]; then
            echo "Checking test_host_runner..."
            ./build/test_host_runner examples/kernels/vector_add.cl || true
          fi
